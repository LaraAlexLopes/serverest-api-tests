name: API tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & collections up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Generated collections match the source
        run: npm run build && git diff --exit-code -- postman

  local:
    name: Local ServeRest (Docker)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run server:up

      - name: Regression
        run: npm run test:regression

      - name: User validation (data-driven)
        if: success() || failure()
        run: npm run test:validation

      - name: Known issues (expected to fail)
        if: success() || failure()
        continue-on-error: true
        run: npm run test:known-issues

      - name: Prepare reports
        if: always()
        run: cp pages/index.html reports/

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-reports
          path: reports
          retention-days: 14

      - uses: actions/upload-pages-artifact@v5
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: reports

      - if: always()
        run: npm run server:down

  public:
    name: Public ServeRest (serverest.dev)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:dev

  report:
    name: Publish reports
    needs: local
    if: always() && github.ref == 'refs/heads/main' && needs.local.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
